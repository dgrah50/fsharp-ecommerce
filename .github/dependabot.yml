version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /Frontend/salt-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /Backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        update-types:
          - minor
          - patch
